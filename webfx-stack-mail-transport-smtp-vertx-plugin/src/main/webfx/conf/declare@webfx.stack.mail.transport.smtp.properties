# Optional fixed-relay fallbacks, used only for messages whose TransportTags carry no SMTP
# route. In Modality the route always comes from the per-account SmtpAccount DB rows, so
# these normally stay empty.
defaultHost = ${{ MAIL_SMTP_DEFAULT_HOST | '' }}
defaultPort = ${{ MAIL_SMTP_DEFAULT_PORT | 25 }}
defaultSsl = ${{ MAIL_SMTP_DEFAULT_SSL | false }}
defaultUsername = ${{ MAIL_SMTP_DEFAULT_USERNAME | '' }}
defaultPassword = ${{ MAIL_SMTP_DEFAULT_PASSWORD | '' }}
