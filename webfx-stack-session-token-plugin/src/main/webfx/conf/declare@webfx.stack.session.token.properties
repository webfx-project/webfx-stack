# Signing keys for the token that carries a caller's identity back to this server.
#
# The server hands a client a signed statement of who it is and reads it back on every message.
# With no key here nothing can be minted and nothing verifies: mint() throws rather than issuing an
# unprotected token, so a misconfigured server refuses to issue identities instead of issuing
# worthless ones.
#
# Generate one as 32 random bytes, base64 encoded. It is a SECRET — anyone holding it can mint a
# token for any user — so it belongs in the deployment's gitignored secret variables file, never in
# a tracked file and never in this repository. See docs/operations/agent-credential-isolation-runbook.md
# for where that lives and who may handle it.
#
# ONE KEY PER ENVIRONMENT, THE SAME KEY ON EVERY INSTANCE OF IT.
#
#   Per environment, because a key is what makes a token believable. Sharing one between production and
#   anywhere else would mean a token minted on staging — anonymised data, looser access — authenticates
#   against production, and a key leaked from a developer's laptop mints production identities for any
#   user. Production, staging and each developer machine get their own; a laptop pointed at a remote
#   database still signs with its own key, because this secures the server, not the database.
#
#   The same on every instance, because production runs two during a blue/green deploy. A client that
#   reconnects to the other instance presents a token minted by the first, and if the keys differ it
#   verifies against neither — so a deploy would sign every user out. Per ENVIRONMENT, not per process.
#
# It must also be STABLE across deploys. Generating one at startup would log everyone out every time the
# server restarts; when it does need changing, that is what previousSigningKey below is for.
#
# NO DEFAULT VALUE HERE, DELIBERATELY. A `${{ VAR | default }}` declaration ignores a value set in a
# configuration file and uses the default instead — measured, not assumed: with the variable defined in
# a file, `${{ V }}` resolves to it while `${{ V | 'x' }}` yields 'x'. Environment variables are
# unaffected, which is what makes it easy to miss. Writing it bare means a key placed in the deployment's
# secret variables is actually read.
signingKey = ${{ SESSION_TOKEN_SIGNING_KEY }}

# The key being retired, during a rotation. Set this to the OLD value when you put a new one in
# signingKey: tokens already in the wild keep verifying until they expire, so a rotation does not
# sign everyone out at once — which is what makes rotations something that actually get done.
# Clear it once the longest possible token lifetime has passed since the change.
previousSigningKey = ${{ SESSION_TOKEN_PREVIOUS_SIGNING_KEY }}

# THE FLIP. Off (or unset) means a client's claimed user id is still trusted on its own and the token
# above is carried but never relied upon; on means a claimed identity with no valid token is refused,
# which is the moment any of this protects anything.
#
# It is a setting rather than a code change because the cost of turning it on cannot be known from the
# code: it logs out every client too old to hold a token, and how many of those are connected is a fact
# about a particular day. So it wants to be decided by a person reading the /monitor client-version
# breakdown, applied in seconds, and reversible in seconds if that breakdown turns out to have been
# read wrong.
#
# TURN IT ON PER ENVIRONMENT, STAGING FIRST AND NOT ON THE SAME DAY. The failure mode is old clients,
# which only exist in the wild, so staging is the only rehearsal available and a shared switch is no
# rehearsal at all.
#
# An old client does not simply get logged out once — it becomes unable to STAY logged in: refused for
# having no token, it logs in successfully, receives one, discards it for want of a field to keep it in,
# and is refused again. A page reload breaks that loop by picking up a current build; nothing else does.
#
# With this on and no usable signingKey above, every user of this server is refused and the process still
# looks healthy — so that combination refuses to start instead. See SessionTokenKeysInitializer.
#
# Bare, with no default, for the same reason as the keys above: `${{ VAR | default }}` ignores a value
# set in a configuration file. Unset, unresolved and anything other than "true" all mean off.
required = ${{ SESSION_TOKEN_REQUIRED }}

# TEST AID — shortens every session lifetime by this factor so the policy can be exercised without waiting a
# day for a back-office session to reach its bound. Uniform on purpose: the RATIOS between the windows stay as
# they are in production, and those ratios are most of what is worth testing.
#
# ONLY HONOURED IN A DEVELOPMENT BUILD. The check reads the environment baked into the build by its Maven
# profile, not anything supplied at run time, so on a server built for staging or production this is refused
# out loud and changes nothing. A jar built with NO profile counts as development — Maven's default — which is
# why a server built by hand for a real deployment must name one, as the deploy workflows do.
# It can only SHORTEN: a value above 1 is refused, and values below 0.005 are clamped up to it.
#
# A useful local setting is 0.007: access window ~13 s, back-office idle window ~76 s, back-office session
# ~10 minutes. Three things to know before testing with it:
#   * The idle window comes first. Act at least once a minute, or the session ends as idle — which is the
#     idle test — long before the warning banner could show.
#   * The banner's lead time belongs to the browser and is NOT scaled: it shows 5 minutes before the end,
#     and from sign-in onwards while a critical operation is registered, since that lead is 15 minutes.
#   * Only sessions signed in after the server starts are affected, and the bound only signs anyone out
#     with SESSION_TOKEN_REQUIRED=true — without it, an expired token is still honoured as a claim.
# The boot log prints every resulting value.
#
# Bare, with no default, for the same reason as the settings above.
lifetimeScale = ${{ SESSION_TOKEN_LIFETIME_SCALE }}
